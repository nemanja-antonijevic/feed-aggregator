services:
  mongo:
    image: mongo:8
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    ports:
      - "27017:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try {
            rs.status().myState === 1 ? quit(0) : quit(1)
          } catch (err) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'localhost:27017' }]
            });
            quit(1)
          }"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
